name: creator-revenue-bridge

services:
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: production
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WEB3_RPC_URL: ${WEB3_RPC_URL:?WEB3_RPC_URL must be set for production}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
