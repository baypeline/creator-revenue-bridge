name: creator-revenue-bridge

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/baypeline/creator-revenue-bridge-frontend}:${IMAGE_TAG:?IMAGE_TAG must be set}
    environment:
      APP_REVISION: ${IMAGE_TAG}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/baypeline/creator-revenue-bridge-backend}:${IMAGE_TAG:?IMAGE_TAG must be set}
    environment:
      APP_REVISION: ${IMAGE_TAG}
      CRB_CORS_ALLOWED_ORIGINS: ${CRB_CORS_ALLOWED_ORIGINS:-https://pricetext.store}
      SPRING_PROFILES_ACTIVE: prod
      WEB3_RPC_URL: ${WEB3_RPC_URL:?WEB3_RPC_URL must be set for production}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
