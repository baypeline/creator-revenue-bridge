spring.application.name=backend

# Frontend origins allowed to call the /api/** endpoints
crb.cors.allowed-origins=http://localhost:3000

# Valuation model inputs per offeringId. Backend serves off-chain data only (no direct
# contract calls); these are the assumptions the discounted cash flow estimate is built on.
crb.valuation.offerings.1.historical-monthly-revenue-raw=850000000
crb.valuation.offerings.1.decimals=6
crb.valuation.offerings.1.monthly-growth-rate=0.03
crb.valuation.offerings.1.annual-discount-rate=0.12
crb.valuation.offerings.1.volatility-risk=0.10
crb.valuation.offerings.1.creator-risk=0.05
crb.valuation.offerings.1.platform-risk=0.05
crb.valuation.offerings.1.projection-months=3
