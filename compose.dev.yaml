name: creator-revenue-bridge-dev

services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  backend:
    build:
      context: ./backend
      target: development
    command: sh ./gradlew bootRun --no-daemon
    environment:
      SPRING_PROFILES_ACTIVE: dev
      WEB3_RPC_URL: http://anvil:8545
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - backend_gradle:/root/.gradle
    depends_on:
      anvil:
        condition: service_healthy

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 15

  foundry:
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    user: "0:0"
    working_dir: /workspace/contracts
    entrypoint: ["forge"]
    command: ["test"]
    environment:
      RPC_URL: http://anvil:8545
    volumes:
      - ./contracts:/workspace/contracts
      - foundry_cache:/workspace/contracts/cache
      - foundry_out:/workspace/contracts/out
    depends_on:
      anvil:
        condition: service_healthy

volumes:
  frontend_node_modules:
  frontend_next:
  backend_gradle:
  foundry_cache:
  foundry_out:
